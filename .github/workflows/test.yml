# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "develop" branch
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  get-changed-files:
    name: Get changed files
    runs-on: ubuntu-latest
    outputs:
      modified_folders: ${{ steps.changed-files.outputs.json_result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install Python Library
        run: |
            pip install fire
      - name: Run Python scripts
        id: changed-files
        run: |
            if ${{ github.event_name == 'pull_request' }}; then
                modified_files=$(git diff --name-only -r HEAD^1 HEAD | xargs)
            else
                modified_files=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | xargs)
            fi
            result=$(python .github/workflows/gh_util_functions.py get_root_folder .github/test1 test1/test2/test3 test2/test2/t.txt)
            echo "json_result: $result"
            echo "json_result=$result" >> $GITHUB_OUTPUT
  data-ingress-svc-image-deploy:
    runs-on: ubuntu-latest
    needs: get-changed-files
    if: ${{ needs.get-changed-files.outputs.modified_folders != '[]' && needs.get-changed-files.outputs.modified_folders != '' }}
    strategy:
      max-parallel: 1 # To ensure a single job is executed at a time, chained and dependent
      matrix:
        env: ['dev', 'stage', 'prod']
        item: ${{ fromJson(needs.get-changed-files.outputs.modified_folders) }}
        exclude:
          - item: '.github'
        include:
          - env: 'dev'
            aws-key: 'dev'
          - env: 'stage'
            aws-key: 'stage'
          - env: 'prod'
            aws-key: 'prod'
        
    name: ${{matrix.item}} deploy - ${{ matrix.env }} - ${{ matrix.aws-key }}
    environment: ${{ matrix.env }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Process matrix item
      run: |
          echo "Processing item: ${{matrix.item}}, ${{matrix.env}}  - ${{ matrix.aws-key }}"
  
